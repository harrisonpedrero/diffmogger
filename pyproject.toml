[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffmogger"
version = "0.2.0"
description = "Local-first starter kit for reviewable Codex automation sidecars."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "apprise>=1.10",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "temporalio>=1.27",
  "tree-sitter>=0.25",
  "tree-sitter-javascript>=0.25",
  "tree-sitter-python>=0.25",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
