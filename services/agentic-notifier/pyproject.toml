[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-notifier"
version = "0.1.0"
description = "Local Apprise notification adapter for autonomous coding-agent workflows."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "apprise>=1.10",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
