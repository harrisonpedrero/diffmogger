[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-notifier"
version = "0.1.0"
description = "Local SMS/WhatsApp notification bridge for autonomous coding-agent workflows."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
  "twilio>=9.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
